name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Inject token
        env:
          TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}
        run: python3 -c "import os;f=open('signup.html');c=f.read();f.close();open('signup.html','w').write(c.replace('{{GH_ISSUES_TOKEN}}',os.environ['TOKEN']))"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
