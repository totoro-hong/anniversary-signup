name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Inject token
        env:
          TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}
        run: |
          python3 << 'EOF'
import os
token = os.environ.get('TOKEN', '')
content = open('signup.html', 'r').read()
content = content.replace('{{GH_ISSUES_TOKEN}}', token)
open('signup.html', 'w').write(content)
print('Token injected successfully')
EOF

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
